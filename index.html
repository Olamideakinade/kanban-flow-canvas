<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Flow Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Kanban Flow</h1>
            <span class="badge">v1.0.0</span>
        </div>
        <div class="toolbar">
            <button id="add-task-btn" class="btn btn-primary">New Task</button>
            <button id="export-btn" class="btn btn-secondary">Export JSON</button>
            <label for="import-file" class="btn btn-secondary">
                Import JSON
                <input type="file" id="import-file" accept=".json" hidden>
            </label>
            <button id="clear-btn" class="btn btn-danger">Reset Board</button>
        </div>
    </header>

    <main class="board-container">
        <section class="column" data-status="todo">
            <div class="column-header">
                <h2>To Do</h2>
                <span class="count" id="count-todo">0</span>
            </div>
            <div class="task-list" data-status="todo"></div>
        </section>

        <section class="column" data-status="in-progress">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="count" id="count-in-progress">0</span>
            </div>
            <div class="task-list" data-status="in-progress"></div>
        </section>

        <section class="column" data-status="review">
            <div class="column-header">
                <h2>Review</h2>
                <span class="count" id="count-review">0</span>
            </div>
            <div class="task-list" data-status="review"></div>
        </section>

        <section class="column" data-status="done">
            <div class="column-header">
                <h2>Done</h2>
                <span class="count" id="count-done">0</span>
            </div>
            <div class="task-list" data-status="done"></div>
        </section>
    </main>

    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Create Task</h3>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title-input">Title</label>
                    <input type="text" id="task-title-input" required placeholder="Implement API endpoint...">
                </div>
                <div class="form-group">
                    <label for="task-desc-input">Description</label>
                    <textarea id="task-desc-input" rows="3" placeholder="Detailed specifications..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority-input">Priority</label>
                    <select id="task-priority-input">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="modal-cancel" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
