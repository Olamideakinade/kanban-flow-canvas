<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Flow Canvas v1.3.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Kanban Flow</h1>
            <span class="badge">v1.3.0</span>
        </div>
        <div class="toolbar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Search tasks... (/)">
            </div>
            <select id="priority-filter" class="filter-select">
                <option value="all">All Priorities</option>
                <option value="high">High Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
            <button id="add-task-btn" class="btn btn-primary">+ New Task</button>
            <button id="export-btn" class="btn btn-secondary" title="Export JSON (E)">Export</button>
            <label class="btn btn-secondary" title="Import JSON">
                Import <input type="file" id="import-file" accept=".json" style="display: none;">
            </label>
            <button id="reset-btn" class="btn btn-danger">Reset</button>
        </div>
    </header>

    <div class="metrics-bar">
        <div class="metric-item">
            <span>Total Tasks:</span>
            <span id="metric-total" class="metric-value">0</span>
        </div>
        <div class="metric-item">
            <span>Completed:</span>
            <span id="metric-completed" class="metric-value">0%</span>
        </div>
        <div class="metric-item">
            <span>Urgent (High):</span>
            <span id="metric-urgent" class="metric-value">0</span>
        </div>
    </div>

    <main class="kanban-board">
        <section class="kanban-column" data-status="todo">
            <div class="column-header">
                <div class="column-title-group">
                    <h2 class="column-title">Todo</h2>
                    <span class="column-count" id="count-todo">0</span>
                </div>
            </div>
            <div class="column-body" id="column-todo"></div>
        </section>

        <section class="kanban-column" data-status="in-progress">
            <div class="column-header">
                <div class="column-title-group">
                    <h2 class="column-title">In Progress</h2>
                    <span class="column-count" id="count-in-progress">0</span>
                </div>
            </div>
            <div class="column-body" id="column-in-progress"></div>
        </section>

        <section class="kanban-column" data-status="done">
            <div class="column-header">
                <div class="column-title-group">
                    <h2 class="column-title">Done</h2>
                    <span class="column-count" id="count-done">0</span>
                </div>
            </div>
            <div class="column-body" id="column-done"></div>
        </section>
    </main>

    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Create New Task</h2>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title-input">Title</label>
                    <input type="text" id="task-title-input" class="form-control" required placeholder="Enter task title...">
                </div>
                <div class="form-group">
                    <label for="task-desc-input">Description</label>
                    <textarea id="task-desc-input" class="form-control" placeholder="Enter task details..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority-input">Priority</label>
                    <select id="task-priority-input" class="form-control">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
